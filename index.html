<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>捏之生</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .game-container {
            width: 960px;
            max-width: 98vw;
            background: #1e1e1e;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .scene-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #3a3a3a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
            transition: background-color 0.3s ease;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: filter 0.4s ease, background-image 0.3s ease, opacity 0.3s ease;
        }

        .protagonist-layer {
            position: absolute;
            left: 50%;
            bottom: 5%;
            width: 30%;
            max-width: 200px;
            height: 70%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
            transform: translateX(-50%);
            transition: left 1s cubic-bezier(0.34, 1.56, 0.64, 1), transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .protagonist-layer.left-position {
            left: 2%;
            transform: translateX(0);
        }

        .protagonist-layer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .item {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            filter: none !important;
            box-shadow: none !important;
        }

        .item img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: none !important;
            box-shadow: none !important;
            pointer-events: none;
        }

        .item:hover {
            transform: scale(1.05);
        }

        .item.moving-to-protagonist {
            z-index: 50;
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .blur-30 {
            filter: blur(4px) !important;
        }

        .blur-80 {
            filter: blur(8px) !important;
        }

        .no-blur {
            filter: blur(0) !important;
        }

        .discover-toast {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #f0c45a;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1.4rem;
            font-weight: bold;
            z-index: 100;
            border: 2px solid #f0c45a;
            pointer-events: none;
            animation: toastFade 2s ease forwards;
            white-space: nowrap;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        .settlement {
            position: absolute;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            overflow: hidden;
        }

        .settlement img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            display: block;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 210;
            animation: confettiFall linear infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
        }

        .petal {
            position: absolute;
            width: 14px;
            height: 14px;
            pointer-events: none;
            z-index: 210;
            background: radial-gradient(circle at 30% 30%, #ffd1e8, #ff9ec7);
            border-radius: 50% 0 50% 50%;
            transform-origin: center;
            animation: petalFall linear infinite;
            opacity: 0.9;
        }

        @keyframes petalFall {
            0% { transform: translateY(-40px) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translateY(300px) translateX(40px) rotate(180deg); opacity: 0.9; }
            100% { transform: translateY(650px) translateX(-30px) rotate(360deg); opacity: 0; }
        }

        .fish-reward {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 220px;
            max-width: 40%;
            pointer-events: none;
            z-index: 180;
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        .fish-reward.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .fish-reward img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(240, 196, 90, 0.9));
        }

        .fish-text {
            position: absolute;
            left: 50%;
            top: 25%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.85);
            color: #f0c45a;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 1.6rem;
            font-weight: bold;
            border: 2px solid #f0c45a;
            z-index: 190;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .fish-text.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #2b2b2b;
            border-radius: 12px;
            color: #ddd;
            font-size: 0.95rem;
        }

        .info-bar .name-tag {
            background: #f0c45a;
            color: #1e1e1e;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .options-panel {
            background: #2b2b2b;
            border-radius: 16px;
            padding: 12px 20px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .question-text {
            color: #f0f0f0;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: center;
        }

        .option-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .option-btn {
            background: #3d3d3d;
            border: none;
            border-radius: 60px;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #eee;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 0 #1a1a1a;
            min-width: 120px;
        }

        .option-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1a1a1a;
        }

        .option-btn:hover {
            background: #4f4f4f;
        }

        .option-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #1a1a1a;
        }

        .reset-btn {
            background: #5a3d3d;
            box-shadow: 0 4px 0 #2a1a1a;
            padding: 8px 24px;
            font-size: 0.95rem;
            min-width: auto;
        }

        .reset-btn:hover {
            background: #6e4a4a;
        }

        .nav-btn {
            background: #3d4a5a;
            box-shadow: 0 4px 0 #1a2a3a;
            padding: 8px 24px;
            font-size: 0.95rem;
            min-width: auto;
        }

        .nav-btn:hover {
            background: #4a5a6e;
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .name-input {
            padding: 10px 20px;
            border-radius: 40px;
            border: 2px solid #f0c45a;
            background: #1e1e1e;
            color: #fff;
            font-size: 1rem;
            outline: none;
            width: 200px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .white-cover {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 300;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .white-cover.show {
            opacity: 1;
            pointer-events: all;
        }

        .hidden {
            display: none !important;
        }

        .intro-line {
            opacity: 0;
            filter: blur(10px);
            transform: translateY(10px);
            animation: introReveal 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes introReveal {
            0% { opacity: 0; filter: blur(10px); transform: translateY(10px); }
            60% { opacity: 0.8; filter: blur(3px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .protagonist-layer {
            pointer-events: auto;
            cursor: pointer;
            transition: left 1s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.3s ease,
                        filter 0.3s ease;
        }

        .protagonist-layer:hover img {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px rgba(240, 196, 90, 0.8)) brightness(1.08);
        }

        .protagonist-layer img {
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .protagonist-layer:active img {
            transform: scale(0.97);
        }

        .protagonist-popup {
            position: absolute;
            pointer-events: none;
            z-index: 300;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f0c45a;
            text-shadow: 0 0 8px rgba(240, 196, 90, 0.9), 0 2px 4px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            animation: popupRise 3s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @keyframes popupRise {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.7); filter: blur(4px); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.1); filter: blur(0); }
            60% { opacity: 1; transform: translate(-50%, -60px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(0.9); filter: blur(3px); }
        }

        .item.shaking {
            animation: rodShake 0.15s linear infinite;
            z-index: 60;
        }

        @keyframes rodShake {
            0%   { transform: translate(0, 0) rotate(0deg); }
            20%  { transform: translate(-2px, 1px) rotate(-3deg); }
            40%  { transform: translate(2px, -1px) rotate(3deg); }
            60%  { transform: translate(-2px, -1px) rotate(-2deg); }
            80%  { transform: translate(2px, 1px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .note {
            position: absolute;
            pointer-events: none;
            z-index: 150;
            font-size: 2rem;
            color: #f0c45a;
            text-shadow: 0 0 10px rgba(240, 196, 90, 0.9);
            animation: noteFloat 2s ease-out forwards;
        }

        @keyframes noteFloat {
            0% { opacity: 0; transform: translateY(0) scale(0.5) rotate(-10deg); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.1) rotate(5deg); }
            60% { opacity: 1; transform: translateY(-80px) scale(1) rotate(-5deg); }
            100% { opacity: 0; transform: translateY(-150px) scale(0.8) rotate(10deg); }
        }

        .item.bouncing {
            animation: catBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            z-index: 60;
        }

        @keyframes catBounce {
            0%   { transform: scale(1) translate(0, 0); }
            25%  { transform: scale(1.15) translate(0, -20px); }
            50%  { transform: scale(0.95) translate(0, 5px); }
            70%  { transform: scale(1.08) translate(0, -10px); }
            85%  { transform: scale(0.98) translate(0, 2px); }
            100% { transform: scale(1) translate(0, 0); }
        }

        .item.bounce-to-protagonist {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .yes-drop {
            position: absolute;
            pointer-events: none;
            z-index: 220;
            font-size: 1.8rem;
            font-weight: bold;
            color: #f0c45a;
            text-shadow: 0 0 10px rgba(240, 196, 90, 0.9), 0 2px 4px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            animation: yesFall linear forwards;
            will-change: transform, opacity;
        }

        @keyframes yesFall {
            0% { opacity: 0; transform: translateY(-40px) rotate(var(--rot-start)) scale(0.6); filter: blur(4px); }
            10% { opacity: 1; filter: blur(0); }
            70% { opacity: 1; filter: blur(0); }
            100% { opacity: 0; transform: translateY(650px) rotate(var(--rot-end)) scale(1); filter: blur(3px); }
        }

        .depart-btn {
            position: absolute;
            right: 3%;
            bottom: 5%;
            z-index: 150;
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 0 #1a1a1a;
            white-space: nowrap;
        }

        .depart-btn.ready {
            background: #4a8e5a;
            color: #fff;
            box-shadow: 0 6px 0 #1e3a1e;
            animation: departPulse 1.5s ease-in-out infinite;
        }

        .depart-btn.ready:hover {
            background: #5aa66e;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #1e3a1e;
        }

        .depart-btn.ready:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e3a1e;
        }

        .depart-btn.locked {
            background: #4a4a4a;
            color: #999;
            cursor: not-allowed;
            box-shadow: 0 6px 0 #1a1a1a;
            opacity: 0.85;
        }

        @keyframes departPulse {
            0%, 100% { box-shadow: 0 6px 0 #1e3a1e, 0 0 0 0 rgba(74, 142, 90, 0.6); }
            50% { box-shadow: 0 6px 0 #1e3a1e, 0 0 0 12px rgba(74, 142, 90, 0); }
        }

        .lavender-pass {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
            overflow: hidden;
        }

        .lavender-cluster {
            position: absolute;
            bottom: 0;
            width: 220px;
            height: 70%;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .lavender-cluster img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: bottom center;
            display: block;
            filter: drop-shadow(0 0 6px rgba(150, 100, 200, 0.35));
        }

        .lavender-cluster.far { height: 45%; width: 160px; opacity: 0.55; filter: blur(1.5px); }
        .lavender-cluster.mid { height: 60%; width: 200px; opacity: 0.8; filter: blur(0.6px); }
        .lavender-cluster.near { height: 80%; width: 260px; opacity: 1; filter: blur(0); }

        /* 飞行小鸟 */
        .flying-bird {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 80;
            pointer-events: none;
            animation: flyAround 4s ease-in-out infinite;
        }

        .flying-bird img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes flyAround {
            0%   { transform: translate(0, 0) rotate(0deg); }
            25%  { transform: translate(30vw, -10vh) rotate(15deg); }
            50%  { transform: translate(60vw, 5vh) rotate(-10deg); }
            75%  { transform: translate(30vw, 15vh) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* 白色椭圆撞击 */
        .white-orb {
            position: absolute;
            width: 40px;
            height: 30px;
            background: radial-gradient(ellipse at center, #fff 0%, #eee 60%, #ccc 100%);
            border-radius: 50%;
            z-index: 120;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        .protagonist-popup.color-xiaonie { color: #933a5f; text-shadow: 0 0 10px rgba(219, 96, 147, 0.9); }
        .protagonist-popup.color-zhongnie { color: #3d79a4; text-shadow: 0 0 10px rgba(45, 110, 156, 0.9); }
        .protagonist-popup.color-gaonie { color: #3f7e2a; text-shadow: 0 0 10px rgba(66, 147, 39, 0.9); }
        .protagonist-popup.color-danie { color: #a17434; text-shadow: 0 0 10px rgba(158, 110, 42, 0.9); }
        .protagonist-popup.color-niao { color: #4a8ec9; text-shadow: 0 0 10px rgba(74, 142, 201, 0.9); }
        .protagonist-popup.color-yu { color: #2a9d8f; text-shadow: 0 0 10px rgba(42, 157, 143, 0.9); }
        .protagonist-popup.color-mao { color: #e07a5f; text-shadow: 0 0 10px rgba(224, 122, 95, 0.9); }
    </style>
</head>
<body>
<div class="game-container">
    <div class="scene-box" id="sceneBox">
        <div class="bg-layer" id="bgLayer"></div>
        <div class="protagonist-layer" id="protagonistLayer">
            <img id="protagonistImg" src="" alt="主角" style="display: none;">
        </div>
        <div class="white-cover" id="whiteCover"></div>
    </div>

    <div class="info-bar">
        <span>主角：<span class="name-tag" id="currentCharacterName">未选择</span></span>
        <span id="sceneLabel">选择角色</span>
    </div>

    <div class="options-panel" id="optionsPanel">
        <div class="question-text" id="questionText">请选择主角</div>
        <div class="option-buttons" id="optionButtons"></div>
    </div>
    <div style="display: flex; justify-content: center; gap: 16px;">
        <button class="option-btn nav-btn" id="prevSceneBtn">← 上一场景</button>
        <button class="option-btn reset-btn" id="resetBtn">🔄 重生</button>
        <button class="option-btn nav-btn" id="nextSceneBtn">下一场景 →</button>
    </div>
</div>

<script>
    (function() {
        const state = {
            character: null,
            phase: 'selection',
            protagonistImg: null,
            items: [],
            hasGlasses: false,
            hasFish: false,
            hasYuLan: false,
            hasGuiHua: false,
            hasBao: false,
            hasPhoneCase: false,
            classmateAName: null,
            classmateBName: null,
            currentScene: null,
            waitingForName: false,
            pendingNameTarget: null,
            confettiTimer: null,
            petalTimer: null,
            zhongItemsClicked: { pingpong: false, baozi: false, glasses: false },
            sceneComplete: false,
            nextScene: null,
            afterChoiceCallback: null,
            fishingActive: false,
            // 新增：猫、鱼、鸟线的状态
            maoMeetGao: false,
            maoMeetFish: false,
            maoMeetGuitar: false,
            yuEnding: null,
            niaoEnding: null,
        };

        const sceneBox = document.getElementById('sceneBox');
        const bgLayer = document.getElementById('bgLayer');
        const protagonistLayer = document.getElementById('protagonistLayer');
        const protagonistImg = document.getElementById('protagonistImg');
        const currentCharacterNameSpan = document.getElementById('currentCharacterName');
        const sceneLabel = document.getElementById('sceneLabel');
        const questionText = document.getElementById('questionText');
        const optionButtons = document.getElementById('optionButtons');
        const resetBtn = document.getElementById('resetBtn');
        const whiteCover = document.getElementById('whiteCover');
        const prevSceneBtn = document.getElementById('prevSceneBtn');
        const nextSceneBtn = document.getElementById('nextSceneBtn');

        // ======================= 场景顺序（含所有角色线） =======================
        const SCENE_ORDER = [
            // 小捏线
            '小捏-家门口',
            '中捏-教室',
            '高捏-家门口',
            '高捏-教室',
            '大捏-家门口',
            '大捏-公交车站',
            '大捏-自习室',
            // 猫线
            '猫-家门口',
            '猫-公交车站',
            // 鱼线
            '鱼-水底',
            // 鸟线
            '鸟-家门口',
            '鸟-薰衣草花田',
            '鸟-公交车站'
        ];

        function setBackground(bgName) {
            bgLayer.style.backgroundImage = `url('${bgName}.jpeg')`;
            sceneLabel.textContent = bgName;
        }

        function clearBackground() {
            bgLayer.style.backgroundImage = 'none';
        }

        function setBlur(type) {
            bgLayer.classList.remove('blur-30', 'blur-80', 'no-blur');
            if (type === '30') bgLayer.classList.add('blur-30');
            else if (type === '80') bgLayer.classList.add('blur-80');
            else bgLayer.classList.add('no-blur');
        }

        function setProtagonist(pngName) {
            if (!pngName) {
                protagonistImg.style.display = 'none';
                state.protagonistImg = null;
                return;
            }
            state.protagonistImg = pngName;
            protagonistImg.src = `${pngName}.png`;
            protagonistImg.style.display = 'block';
            protagonistImg.onerror = () => {
                protagonistImg.alt = `[${pngName}]`;
                protagonistImg.style.display = 'block';
            };
        }

        function clearItems() {
            document.querySelectorAll('.item').forEach(el => el.remove());
            state.items = [];
        }

        function addItem(itemConfig) {
            const { id, name, img, x, y, w, h, type, action } = itemConfig;
            const div = document.createElement('div');
            div.className = 'item';
            div.id = `item-${id}`;
            div.style.left = x + '%';
            div.style.top = y + '%';
            div.style.width = w + '%';
            div.style.height = h + '%';
            div.dataset.itemId = id;
            div.dataset.name = name;
            div.dataset.type = type;
            div.dataset.action = action || '';

            div.dataset.originalW = w;

            imgEl.style.objectFit = 'contain';
            imgEl.onerror = () => { imgEl.alt = `[${img}]`; };
            div.appendChild(imgEl);

            div.addEventListener('click', (e) => {

        function moveItemToProtagonist(itemEl, callback) {
            const protagonistRect = protagonistLayer.getBoundingClientRect();
            const sceneRect = sceneBox.getBoundingClientRect();

            const targetX = protagonistRect.left - sceneRect.left + protagonistRect.width / 2;
            const targetY = protagonistRect.top - sceneRect.top + protagonistRect.height / 2;

            const itemRect = itemEl.getBoundingClientRect();
            const currentX = itemRect.left - sceneRect.left + itemRect.width / 2;
            const currentY = itemRect.top - sceneRect.top + itemRect.height / 2;

            itemEl.classList.add('moving-to-protagonist');

            const deltaX = targetX - currentX;
            const deltaY = targetY - currentY;

            itemEl.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.5)`;
            itemEl.style.opacity = '0.6';

            setTimeout(() => {
                if (callback) callback();
            }, 800);
        }

        function moveItemBack(itemEl) {
            itemEl.classList.remove('moving-to-protagonist');

            const protagonistRect = protagonistLayer.getBoundingClientRect();
            const sceneRect = sceneBox.getBoundingClientRect();

            const protagonistWidth = (protagonistRect.width / sceneRect.width) * 100;
            const protagonistHeight = (protagonistRect.height / sceneRect.height) * 100;
            const protagonistLeft = ((protagonistRect.left - sceneRect.left) / sceneRect.width) * 100;
            const protagonistTop = ((protagonistRect.top - sceneRect.top) / sceneRect.height) * 100;

            const currentImg = itemEl.querySelector('img');
            const isTransformed = itemEl.dataset.transformed === 'true';
            const itemName = itemEl.dataset.name || '';

            if (isTransformed && currentImg) {
                itemEl.style.transition = 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                itemEl.style.left = protagonistLeft + '%';
                itemEl.style.top = protagonistTop + '%';
                itemEl.style.width = protagonistWidth + '%';
                itemEl.style.height = protagonistHeight + '%';
                itemEl.style.transform = 'translate(0, 0)';
                itemEl.style.opacity = '1';
                itemEl.style.zIndex = '60';

                setTimeout(() => {
                    itemEl.style.transition = 'all 1s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    itemEl.style.left = itemEl.dataset.originalX + '%';
                    if (itemName === '中包' || itemName === '同学a' || itemName === '同学b') {
                        itemEl.style.top = protagonistTop + '%';
                        itemEl.style.width = protagonistWidth + '%';
                        itemEl.style.height = protagonistHeight + '%';
                    } else {
                        itemEl.style.top = itemEl.dataset.originalY + '%';
                        itemEl.style.width = itemEl.dataset.originalW + '%';
                        itemEl.style.height = itemEl.dataset.originalH + '%';
                        itemEl.style.zIndex = '';
                    }

                    setTimeout(() => {
                        itemEl.style.transition = '';
                        itemEl.style.transform = '';
                        itemEl.style.opacity = '';
                    }, 1000);
                }, 800);
            } else {
                itemEl.style.transform = '';
                itemEl.style.opacity = '';
            }
        }

// 小鸟一起飞
function launchBirdFlyTogether(birdEl, birdBagEl, callback) {
    if (!birdEl || !birdBagEl) {
        if (callback) callback();
        return;
    }

    // 记录主角和鸟包的原始位置/尺寸，用于结束后恢复
    const birdOriginalLeft = birdEl.style.left;
    const birdOriginalTop = birdEl.style.top;
    const birdOriginalWidth = birdEl.style.width;
    const birdOriginalHeight = birdEl.style.height;

    const bagOriginalLeft = birdBagEl.style.left;
    const bagOriginalTop = birdBagEl.style.top;
    const bagOriginalWidth = birdBagEl.style.width;
    const bagOriginalHeight = birdBagEl.style.height;

    // 先让鸟包靠近鸟，但不要动主角层
    const sceneRect = sceneBox.getBoundingClientRect();
    const birdRect = birdEl.getBoundingClientRect();
    const bagRect = birdBagEl.getBoundingClientRect();

    const birdX = birdRect.left - sceneRect.left + birdRect.width / 2;
    const birdY = birdRect.top - sceneRect.top + birdRect.height / 2;

    birdBagEl.style.transition = 'all 1s cubic-bezier(0.34, 1.56, 0.64, 1)';
    birdBagEl.style.left = (birdX - bagRect.width / 2) + 'px';
    birdBagEl.style.top = (birdY - bagRect.height / 2) + 'px';
    birdBagEl.style.width = birdRect.width + 'px';
    birdBagEl.style.height = birdRect.height + 'px';

    setTimeout(() => {
        // 隐藏原来的物品（只隐藏物品层，不动主角层）
        birdEl.style.opacity = '0';
        birdBagEl.style.opacity = '0';

        // 创建两只飞舞的鸟
        const flyer1 = document.createElement('div');
        flyer1.className = 'flying-bird';
        flyer1.style.left = (birdX - 30) + 'px';
        flyer1.style.top = (birdY - 30) + 'px';
        const img1 = document.createElement('img');
        img1.src = '鸟.png';
        img1.alt = '鸟';
        flyer1.appendChild(img1);
        sceneBox.appendChild(flyer1);

        const flyer2 = document.createElement('div');
        flyer2.className = 'flying-bird';
        flyer2.style.left = (birdX + 30) + 'px';
        flyer2.style.top = (birdY - 20) + 'px';
        flyer2.style.animationDelay = '0.5s';
        const img2 = document.createElement('img');
        img2.src = '鸟包.png';
        img2.alt = '鸟包';
        flyer2.appendChild(img2);
        sceneBox.appendChild(flyer2);

        // 飞行动画结束后，清理并回调
        setTimeout(() => {
            if (flyer1.parentNode) flyer1.remove();
            if (flyer2.parentNode) flyer2.remove();

            // 恢复主角显示（防止被误隐藏）
            protagonistImg.style.opacity = '1';
            protagonistImg.style.display = 'block';

            // 恢复鸟包原位置和尺寸
            birdBagEl.style.transition = 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
            birdBagEl.style.left = bagOriginalLeft;
            birdBagEl.style.top = bagOriginalTop;
            birdBagEl.style.width = bagOriginalWidth;
            birdBagEl.style.height = bagOriginalHeight;
            birdBagEl.style.opacity = '1';

            // 恢复主角层原位置和尺寸（birdEl 就是 protagonistLayer 时）
            // 如果 birdEl 是主角层，恢复它的样式
            if (birdEl.style.left || birdEl.style.top || birdEl.style.width || birdEl.style.height) {
                birdEl.style.transition = 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                birdEl.style.left = birdOriginalLeft;
                birdEl.style.top = birdOriginalTop;
                birdEl.style.width = birdOriginalWidth;
                birdEl.style.height = birdOriginalHeight;
            }
            birdEl.style.opacity = '1';

            // 过渡结束后清理内联 transition
            setTimeout(() => {
                birdBagEl.style.transition = '';
                if (birdEl.style.transition) birdEl.style.transition = '';
            }, 900);

            if (callback) callback();
        }, 4500);
    }, 1000);
}

        // ======================= 场景加载 =======================
        function loadScene(sceneKey, animateIn = false) {
            const scene = SCENES[sceneKey];
            removeDepartButton();
            if (!scene) {
                console.warn('场景不存在:', sceneKey);
                return;
            }

            state.currentScene = sceneKey;
            state.sceneComplete = false;
            state.fishingActive = false;

            setBackground(scene.bg);
            setBlur(scene.blur || 'none');
            setProtagonist(scene.protagonist);
            protagonistLayer.classList.add('left-position');

            clearItems();

            if (scene.items && scene.items.length) {
                scene.items.forEach(item => addItem(item));
            }

            currentCharacterNameSpan.textContent = scene.protagonist || state.character || '???';

            if (scene.protagonist === '中捏') {
                state.zhongItemsClicked = { pingpong: false, baozi: false, glasses: false };
            }

            if (scene.endMessage) {
                questionText.textContent = '熟悉的场景，到处探索一下吧...';
            }

            optionButtons.innerHTML = '';
            updateNavButtons();
        }

        function updateNavButtons() {
            if (!state.currentScene) {
                prevSceneBtn.disabled = true;
                nextSceneBtn.disabled = true;
                return;
            }
            const idx = SCENE_ORDER.indexOf(state.currentScene);
            prevSceneBtn.disabled = (idx <= 0);
            nextSceneBtn.disabled = (idx < 0 || idx >= SCENE_ORDER.length - 1);
        }

        function goToPrevScene() {
            if (!state.currentScene) return;
            if (state.fishingActive) return;
            const idx = SCENE_ORDER.indexOf(state.currentScene);
            if (idx <= 0) return;
            whiteCover.classList.add('show');
            setTimeout(() => {
                loadScene(SCENE_ORDER[idx - 1]);
                whiteCover.classList.remove('show');
            }, 400);
        }

        function goToNextScene() {
            if (!state.currentScene) return;
            if (state.fishingActive) return;
            const idx = SCENE_ORDER.indexOf(state.currentScene);
            if (idx < 0 || idx >= SCENE_ORDER.length - 1) return;
            whiteCover.classList.add('show');
            setTimeout(() => {
                loadScene(SCENE_ORDER[idx + 1]);
                whiteCover.classList.remove('show');
            }, 400);
        }

        const protagonistLineIndex = { '小捏': 0, '中捏': 0, '高捏': 0, '大捏': 0, '鸟': 0, '鱼': 0, '猫': 0 };

        function initProtagonistClick() {
            if (protagonistLayer.dataset.clickBound === 'true') return;
            protagonistLayer.dataset.clickBound = 'true';

            protagonistLayer.addEventListener('click', (e) => {
                e.stopPropagation();
                if (state.phase !== 'exploring') return;
                if (state.fishingActive) return;

                const currentName = currentCharacterNameSpan.textContent;
                const lines = PROTAGONIST_LINES[currentName];
                if (!lines || lines.length === 0) return;

                if (protagonistLineIndex[currentName] === undefined) {
                    protagonistLineIndex[currentName] = 0;
                }
                const lineIndex = protagonistLineIndex[currentName] % lines.length;
                const line = lines[lineIndex];
                protagonistLineIndex[currentName] = (lineIndex + 1) % lines.length;

                const popup = document.createElement('div');
                popup.className = 'protagonist-popup';
                const colorClass = PROTAGONIST_COLOR_MAP[currentName];
                if (colorClass) popup.classList.add(colorClass);
                popup.textContent = line;

                const sceneRect = sceneBox.getBoundingClientRect();
                const protRect = protagonistLayer.getBoundingClientRect();
                const x = protRect.left - sceneRect.left + protRect.width / 2;
                const y = protRect.top - sceneRect.top + protRect.height * 0.25 - 80;

                popup.style.left = x + 'px';
                popup.style.top = y + 'px';

                sceneBox.appendChild(popup);

                setTimeout(() => {
                    if (popup.parentNode) popup.remove();
                }, 3000);
            });
        }

        function handleItemClick(itemId, itemName, type, action) {
            if (state.phase !== 'exploring') return;
            if (state.sceneComplete) return;
            if (state.fishingActive) return;

            const itemEl = document.getElementById(`item-${itemId}`);
            if (!itemEl) return;

            if (itemEl.style.pointerEvents === 'none' && itemId !== 'glasses') return;

                itemEl.style.pointerEvents = 'none';
            }

            if (state.currentScene && state.currentScene.includes('中捏')) {
                if (itemId === 'pingpong') state.zhongItemsClicked.pingpong = true;
                if (itemId === 'baozi') state.zhongItemsClicked.baozi = true;
                if (itemId === 'glasses') state.zhongItemsClicked.glasses = true;
            }
            if (departButtonEl) {
                updateDepartButton();
            }

            showToast(`发现了 ${itemName}！`);

        function checkSceneComplete() {
            const scene = SCENES[state.currentScene];
            if (!scene) return;
            if (departButtonEl) {
                updateDepartButton();
            }

            if (state.sceneComplete) return;
            const remainingItems = document.querySelectorAll('.item');
            if (remainingItems.length === 0) {
                completeScene();
                return;
            }

            if (state.currentScene && state.currentScene.includes('中捏')) {
                if (state.zhongItemsClicked.pingpong && state.zhongItemsClicked.baozi && state.zhongItemsClicked.glasses) {
                    completeScene();
                }
            }
        }

        function completeScene() {
            if (state.sceneComplete) return;
            state.sceneComplete = true;

            const scene = SCENES[state.currentScene];
            if (!scene) return;

            questionText.textContent = scene.endMessage || '场景结束（可点击下方"下一场景"继续）';
            optionButtons.innerHTML = '';
        }

        function askQuestion(question, options, itemEl) {
            questionText.textContent = question;
            optionButtons.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.onclick = () => {
                    optionButtons.innerHTML = '';
                    questionText.textContent = '...';
                    executeChoice(opt.action, itemEl);
                };
                optionButtons.appendChild(btn);
            });
        }

        // ======================= 钓鱼小游戏 =======================
        function startFishingScene(fishingRodEl) {
            state.fishingActive = true;
            setBackground('湖边');

            document.querySelectorAll('.item').forEach(el => {
                if (el.id !== 'item-fishingrod') {
                    el.style.display = 'none';
                }
            });
            if (fishingRodEl) {
                fishingRodEl.style.display = '';
                fishingRodEl.style.pointerEvents = 'none';
            }

            questionText.textContent = '来到湖边，准备钓鱼……';
            optionButtons.innerHTML = '';

            const castBtn = document.createElement('button');
            castBtn.className = 'option-btn';
            castBtn.textContent = '甩杆！';
            castBtn.onclick = () => {
                optionButtons.innerHTML = '';
                questionText.textContent = '等待鱼儿上钩……';

                if (fishingRodEl) {
                    fishingRodEl.classList.add('shaking');
                }

                setTimeout(() => {
                    if (fishingRodEl) {
                        fishingRodEl.classList.remove('shaking');
                    }
                    showFishingResult(fishingRodEl);
                }, 3000);
            };
            optionButtons.appendChild(castBtn);
        }

        function showFishingResult(fishingRodEl) {
            const fishReward = document.createElement('div');
            fishReward.className = 'fish-reward';
            const fishImg = document.createElement('img');
            fishImg.src = '鱼.png';
            fishImg.alt = '鱼';
            fishImg.onerror = () => { fishImg.alt = '[鱼]'; };
            fishReward.appendChild(fishImg);
            sceneBox.appendChild(fishReward);

            const fishText = document.createElement('div');
            fishText.className = 'fish-text';
            fishText.textContent = '获得了鱼！';
            sceneBox.appendChild(fishText);

            requestAnimationFrame(() => {
                fishReward.classList.add('show');
                fishText.classList.add('show');
            });

            launchConfetti();

            setTimeout(() => {
                fishReward.classList.remove('show');
                fishText.classList.remove('show');
                setTimeout(() => {
                    if (fishReward.parentNode) fishReward.remove();
                    if (fishText.parentNode) fishText.remove();
                }, 500);

                setBackground('家门口');

                document.querySelectorAll('.item').forEach(el => {
                    el.style.display = '';
                });
                if (fishingRodEl) {
                    fishingRodEl.style.pointerEvents = '';
                    fishingRodEl.classList.remove('shaking');
                }

                state.fishingActive = false;
                state.hasFish = true;

                questionText.textContent = '这下可以饱餐一顿了！';
                optionButtons.innerHTML = '';

                setTimeout(() => {
                    checkSceneComplete();
                }, 500);
            }, 3500);
        }

                case 'yu_yubao_no':
                    questionText.textContent = '再好好想想……';
                    setTimeout(() => {
                        askQuestion('是否靠近鱼包？', [
                            { text: '是', action: 'yu_yubao_yes' },
                            { text: '否', action: 'yu_yubao_no' }
                        ], itemEl);
                    }, 800);
                    break;

                // ---------- 鸟线 ----------
                case 'niao_xiaonie_yes':
                    questionText.textContent = '你攻击了小捏！坏鸟！';
                    // 从鸟的位置发射白色椭圆到小捏
                    const birdEl = document.getElementById('item-xiaonie');
                    if (itemEl && birdEl) {
                        launchWhiteOrb(protagonistLayer, birdEl);
                    }
                    setTimeout(() => { afterAction(); }, 2000);
                    break;
                case 'niao_xiaonie_no':
                    questionText.textContent = '无事发生……';
                    setTimeout(() => { afterAction(); }, 800);
                    break;

                case 'niao_niaobao_yes':
                    questionText.textContent = '你遇到了鸟包，一起享受飞行吧...';
                    const niaoEl = document.getElementById('item-niaobao');
                    launchBirdFlyTogether(protagonistLayer, niaoEl, () => {
                        questionText.textContent = '你们建立了羁绊……';
                        // 飞行动画结束（物品归位、主角恢复）后，再判断是否在公交车站触发结算
                        if (sceneLabel.textContent === '公交车站') {
                            questionText.textContent = '你们比翼双飞……';
                            setTimeout(() => { showSettlement('鸟合照'); }, 2000);
                        }
                    });
                    break;
                case 'niao_niaobao_no':
                    questionText.textContent = '再好好想想……';
                    setTimeout(() => {
                        askQuestion('发现一只眼熟的鸟，是否靠近？', [
                            { text: '是', action: 'niao_niaobao_yes' },
                            { text: '否', action: 'niao_niaobao_no' }
                        ], itemEl);
                    }, 800);
                    break;

                default:
                    console.warn('未知选项:', action);
            }
        }

        function renderNameInput(promptText, callback) {
            questionText.textContent = promptText;
            optionButtons.innerHTML = '';

            const inputRow = document.createElement('div');
            inputRow.className = 'input-row';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'name-input';
            input.placeholder = '输入名字';

            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'option-btn';
            confirmBtn.textContent = '确认';
            confirmBtn.style.padding = '10px 24px';
            confirmBtn.style.fontSize = '1rem';

            confirmBtn.onclick = () => {
                const name = input.value.trim() || (state.pendingNameTarget === '同学a' ? '同学a' : '同学b');
                if (state.pendingNameTarget === '同学a') {
                    state.classmateAName = name;
                } else if (state.pendingNameTarget === '同学b') {
                    state.classmateBName = name;
                }
                state.waitingForName = false;
                state.pendingNameTarget = null;
                inputRow.remove();
                if (callback) callback();
            };

            inputRow.appendChild(input);
            inputRow.appendChild(confirmBtn);
            optionButtons.appendChild(inputRow);
            input.focus();

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    confirmBtn.click();
                }
            });
        }

        // ======================= 结算页面（支持不同主图） =======================

                    break;

        function launchConfettiLoop() {
            if (state.confettiTimer) clearInterval(state.confettiTimer);

            const colors = ['#f0c45a', '#ff7b7b', '#7bc9ff', '#9bff7b', '#ffb3ff', '#ffffff', '#ffaa00'];
            state.confettiTimer = setInterval(() => {
                for (let i = 0; i < 6; i++) {
                    const conf = document.createElement('div');
                    conf.className = 'confetti';
                    const size = 6 + Math.random() * 14;
                    conf.style.width = size + 'px';
                    conf.style.height = size + 'px';
                    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                    conf.style.left = Math.random() * 100 + '%';
                    conf.style.top = '-20px';
                    conf.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
                    conf.style.animationDelay = Math.random() * 0.5 + 's';
                    conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    conf.style.zIndex = '210';
                    sceneBox.appendChild(conf);

                    setTimeout(() => {
                        if (conf.parentNode) conf.remove();
                    }, 4500);
                }
            }, 250);
        }

        function fadeOutIntroText(callback) {
            const introText = sceneBox.querySelector('.intro-text');
            if (!introText) {
                if (callback) callback();
                return;
            }

            const lines = introText.querySelectorAll('.intro-line');
            lines.forEach((line, index) => {
                line.style.animation = 'none';
                line.style.opacity = '1';
                line.style.filter = 'blur(0)';
                line.style.transition = `opacity 0.6s ease ${index * 0.1}s, filter 0.6s ease ${index * 0.1}s, transform 0.6s ease ${index * 0.1}s`;
            });

            requestAnimationFrame(() => {
                lines.forEach(line => {
                    line.style.opacity = '0';
                    line.style.filter = 'blur(8px)';
                    line.style.transform = 'scale(0.95)';
                });

                setTimeout(() => {
                    if (introText.parentNode) introText.remove();
                    if (callback) callback();
                }, 900);
            });
        }

        // ======================= 出发按钮 =======================
        let departButtonEl = null;

        function showDepartButton() {
            removeDepartButton();

            departButtonEl = document.createElement('button');
            departButtonEl.className = 'depart-btn';
            departButtonEl.id = 'departBtn';
            sceneBox.appendChild(departButtonEl);

            updateDepartButton();

            departButtonEl.addEventListener('click', (e) => {
                e.stopPropagation();
                if (departButtonEl.classList.contains('locked')) {
                    showToast('好像忘记了一些东西……');
                    return;
                }
                removeDepartButton();
                showSettlement('合照');
            });
        }

        function updateDepartButton() {
            if (!departButtonEl) return;

            const scene = SCENES[state.currentScene];
            if (!scene || !scene.items || scene.items.length === 0) {
                departButtonEl.textContent = '准备好了！出发吧！';
                departButtonEl.classList.remove('locked');
                departButtonEl.classList.add('ready');
                return;
            }

            let allClicked = true;
            for (const itemConfig of scene.items) {
                const itemEl = document.getElementById(`item-${itemConfig.id}`);
                if (itemEl && itemEl.style.pointerEvents !== 'none' && itemEl.style.display !== 'none') {
                    allClicked = false;
                    break;
                }
            }

            if (allClicked) {
                departButtonEl.textContent = '准备好了！出发吧！';
                departButtonEl.classList.remove('locked');
                departButtonEl.classList.add('ready');
            } else {
                departButtonEl.textContent = '感觉好像有什么忘带了...';
                departButtonEl.classList.remove('ready');
                departButtonEl.classList.add('locked');
            }
        }

        function removeDepartButton() {
            if (departButtonEl && departButtonEl.parentNode) {
                departButtonEl.remove();
            }
            departButtonEl = null;
        }

        // ======================= 薰衣草飘过动画 =======================
        function launchLavenderPass(duration = 4500) {
            const old = sceneBox.querySelector('.lavender-pass');
            if (old) old.remove();

            const container = document.createElement('div');
            container.className = 'lavender-pass';
            sceneBox.appendChild(container);

            const layers = [
                { cls: 'far',  count: 3, startOffset: 0 },
                { cls: 'mid',  count: 4, startOffset: 0.15 },
                { cls: 'near', count: 3, startOffset: 0.35 }
            ];

            layers.forEach(layer => {
                for (let i = 0; i < layer.count; i++) {
                    const cluster = document.createElement('div');
                    cluster.className = `lavender-cluster ${layer.cls}`;

                    const img = document.createElement('img');
                    img.src = '薰衣草.png';
                    img.alt = '薰衣草';
                    img.onerror = () => {
                        img.style.display = 'none';
                        cluster.style.background = `linear-gradient(to top, #6a4a9e 0%, #8b6ab8 30%, #b39ddb 70%, transparent 100%)`;
                        cluster.style.borderRadius = '50% 50% 0 0';
                        cluster.style.boxShadow = 'inset 0 0 20px rgba(150, 100, 200, 0.6)';
                    };
                    cluster.appendChild(img);

                    const bottomOffset = Math.random() * 8;
                    cluster.style.bottom = bottomOffset + '%';

                    const startX = -30 - Math.random() * 20;
                    cluster.style.transform = `translateX(${startX}%)`;

                    const delay = Math.random() * 600 + (i * 120);
                    const thisDuration = duration * (0.9 + Math.random() * 0.2);

                    cluster.style.transition = `transform ${thisDuration}ms linear ${delay}ms, opacity ${thisDuration}ms linear ${delay}ms`;
                    cluster.style.opacity = '0';

                    container.appendChild(cluster);

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            const endX = 130 + Math.random() * 20;
                            cluster.style.transform = `translateX(${endX}%)`;
                            cluster.style.opacity = layer.cls === 'far' ? '0.55' : (layer.cls === 'mid' ? '0.8' : '1');
                        });
                    });

                    setTimeout(() => {
                        cluster.style.transition = `opacity 600ms ease`;
                        cluster.style.opacity = '0';
                        setTimeout(() => {
                            if (cluster.parentNode) cluster.remove();
                        }, 700);
                    }, delay + thisDuration);
                }
            });

            setTimeout(() => {
                if (container.parentNode) container.remove();
            }, duration + 2000);
        }

        resetBtn.onclick = resetGame;
        prevSceneBtn.onclick = goToPrevScene;
        nextSceneBtn.onclick = goToNextScene;

        resetGame();
        initProtagonistClick();

        window.__game = { state, loadScene, resetGame };
    })();
